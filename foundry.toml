[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
optimizer = true
via_ir = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    # v4-core is a TEST-ONLY dependency. src/ deliberately keeps its own vendored minimal
    # interfaces (src/interfaces/uniswapV4) so the deployed contract has no external dependency.
    "v4-core/=lib/v4-core/",
    "solmate/=lib/v4-core/lib/solmate/"
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
arb1 = "${ARBITRUM_RPC_URL}"

# Fork tests. See test/fork/README.md for how to run them.
#
# These suites read live pool state, and one deep swap costs an RPC storage read per tick crossed.
# Against a rate-limited endpoint that becomes HTTP 429s, surfacing as
# "EVM error; database error: failed to get storage for ..." — a failure that says nothing about
# the contract. Fewer fuzz runs keeps the request count down; the rest is done by throttling the
# node itself (README).
# The CI workflow sets FOUNDRY_PROFILE=ci. Without this section Foundry warns and silently falls
# back to the default profile, so any CI-specific setting would go unapplied.
[profile.ci]
fuzz = { runs = 256 }

[profile.fork]
fuzz = { runs = 64 }
# A throttled upstream makes replies slow rather than fast-failing. Wait rather than error out.
eth_rpc_timeout = 300


# FOUNDRY_PROFILE=prod forge build

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = 'long'
multiline_func_header = 'all'      # This ensures function declarations stay multi-line
quote_style = 'double'
number_underscore = 'preserve'
single_line_statement_blocks = 'preserve'
ignore = ["src/console.sol", "src/console2.sol"]

[lint]
exclude_lints = ["unaliased-plain-import","asm-keccak256","mixed-case-variable","mixed-case-function","divide-before-multiply"]
