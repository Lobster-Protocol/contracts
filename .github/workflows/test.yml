name: CI

on:
  push:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned, not `stable`. `forge fmt` output changes between releases, so a floating
          # version makes `fmt --check` fail whenever CI and local developers are on different
          # builds. Bump this deliberately, and run `forge fmt` in the same commit.
          version: v1.5.1

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge lint
        run: |
          forge lint --deny warnings
        id: lint

      - name: Run Forge build
        run: |
          forge build --sizes --optimize
        id: build

      # test/fork/** is excluded: those suites fork a live chain and need an RPC endpoint, so they
      # are run locally rather than in CI. See test/fork/README.md.
      - name: Run Forge tests
        run: |
          forge test --no-match-path "test/fork/**" -vvv
        id: test
